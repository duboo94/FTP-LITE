name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE files
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --noconsole --clean --icon FTP_Lite.ico --name FTP_Lite FTP_Lite.pyw
          python -m PyInstaller --onefile --noconsole --clean --icon FTP_Lite.ico --name FTP_Lite_tmp --runtime-tmpdir "C:\ProgramData" FTP_Lite.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: FTP_Lite-exe
          path: |
            dist/FTP_Lite.exe
            dist/FTP_Lite_tmp.exe
